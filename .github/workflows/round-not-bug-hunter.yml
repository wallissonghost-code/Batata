name: ROUND NOT Bug Hunter

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: round-not-bug-hunter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frame-contract:
    name: Frame contract / no duplicates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate active doll assets and runtime contract
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "assets/Total costa.png"
            "assets/comecando a virar.png"
            "assets/Olhando de canto de rosto .png"
            "assets/Frente total.png"
          )
          for file in "${files[@]}"; do
            test -s "$file" || { echo "::error::Frame ativo ausente ou vazio: $file"; exit 1; }
          done

          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          text = Path('js/runtime/doll-assets.js').read_text(encoding='utf-8')
          expected = [
              './assets/Total costa.png',
              './assets/comecando a virar.png',
              './assets/Olhando de canto de rosto .png',
              './assets/Frente total.png',
          ]
          match = re.search(r'const FRAME_PATHS\s*=\s*\[(.*?)\];', text, re.S)
          if not match:
              print('::error::FRAME_PATHS nao encontrado'); sys.exit(1)
          actual = re.findall(r"['\"]([^'\"]+\.png)['\"]", match.group(1))
          if actual != expected:
              print('::error::Sequencia ativa incorreta. Esperado: ' + ' -> '.join(expected))
              print('Atual: ' + ' -> '.join(actual)); sys.exit(1)
          if len(actual) != 4 or len(set(actual)) != 4:
              print('::error::A virada deve possuir exatamente 4 poses unicas'); sys.exit(1)
          forbidden = {'./assets/Lateral.png', './assets/Comecando a virar.png'}
          if forbidden.intersection(actual):
              print('::error::Frame removido da animacao voltou ao runtime'); sys.exit(1)
          print('OK: 4 poses ativas, unicas e na ordem validada.')
          PY

      - name: Validate bot regression rules
        shell: bash
        run: |
          set -euo pipefail
          grep -q "EXPECTED_FORWARD = \[0, 1, 2, 3\]" js/test/visual-gameplay-bot.js
          grep -q "EXPECTED_BACKWARD = \[3, 2, 1, 0\]" js/test/visual-gameplay-bot.js
          grep -q "walk: 'Total costa'" js/test/visual-gameplay-bot.js
          grep -q "watch: 'Frente total'" js/test/visual-gameplay-bot.js
          echo "OK: bot treinado para as 4 poses."

      - name: Reject repeated or skipped frame inside one turn
        shell: bash
        run: |
          python3 - <<'PY'
          def validate(seq, expected):
              return seq == expected and len(seq) == len(set(seq)) == 4
          forward = [0,1,2,3]
          backward = [3,2,1,0]
          assert validate(forward, forward)
          assert validate(backward, backward)
          assert not validate([0,1,1,2,3], forward)
          assert not validate([0,2,3], forward)
          assert not validate([3,2,2,1,0], backward)
          assert not validate([3,1,0], backward)
          print('OK: repeticao e salto de frame sao rejeitados.')
          PY

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          find js -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
