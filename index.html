<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#07110c" />
  <title>ROUND NOT</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand"><span>ROUND</span><strong>NOT</strong></div>
      <div id="phase" class="phase green">PODE ANDAR</div>
      <div id="timer" class="timer">03:00</div>
    </header>
    <section class="arena-wrap">
      <canvas id="game" aria-label="Arena Round Not"></canvas>
      <div id="countdown" class="countdown hidden"></div>
      <div id="finishPanel" class="finish-panel hidden">
        <small>PARTIDA ENCERRADA</small><h1>ROUND NOT</h1>
        <div id="results"></div>
        <button id="restart">JOGAR NOVAMENTE</button>
      </div>
    </section>
    <footer class="hud">
      <span class="build-version" aria-label="Versão Beta 00.7">Beta 00.7</span>
      <div><small>VIVOS</small><strong id="alive">0</strong></div>
      <div><small>CHEGARAM</small><strong id="finished">0</strong></div>
      <div><small>ELIMINADOS</small><strong id="dead">0</strong></div>
      <button id="addBot">+ BOT</button>
    </footer>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
